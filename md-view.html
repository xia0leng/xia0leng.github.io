<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown文档渲染</title>
<script src="/js/marked.min.js"></script>
<link rel="stylesheet" href="/css/markdown.css">
</head>
<body>
<main id="container" class="markdown-body"></main>
<script>
// 1. 读取URL参数
const urlParams = new URLSearchParams(location.search);
let mdPath = urlParams.get('file');

// 2. 无参数时，读取路径作为md文件（适配 /Drugs/ARP 路由）
if(!mdPath){
    mdPath = location.pathname + '.md';
}

// 3. 请求路径统一从站点根目录解析，不限制 Markdown 所在目录
mdPath = '/' + mdPath.replace(/^\/+/, '');
fetch(mdPath)
.then(res=>{
    if(!res.ok) throw new Error("文件不存在或读取失败");
    return res.text();
})
.then(mdText=>{
    const html = marked.parse(mdText);
    document.getElementById('container').innerHTML = html;
})
.catch(err=>{
    const error = document.createElement('p');
    error.style.color = 'red';
    error.textContent = `加载异常：${err.message}`;
    document.getElementById('container').replaceChildren(error);
})
</script>
</body>
</html>
